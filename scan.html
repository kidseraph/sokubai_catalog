<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title"></h1>
    <div class="lang" id="lang"></div>
  </header>

  <main>
    <div id="reader" hidden></div>
    <button class="btn wide" type="button" id="start"></button>

    <div class="result" id="result" hidden></div>

    <form class="manual" id="manual" autocomplete="off">
      <input id="manual-input" type="text" inputmode="text" autocapitalize="off" spellcheck="false">
      <button class="btn ghost" type="submit" id="manual-btn"></button>
    </form>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="scan.js"></script>
</body>
</html>
